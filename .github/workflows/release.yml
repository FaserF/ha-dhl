---
name: Release

on:
  workflow_dispatch:
    inputs:
      release_type:
        description: "Type of release (stable, beta, nightly)"
        required: true
        default: "stable"
        type: choice
        options:
          - stable
          - beta
          - nightly

      bump_level:
        description: "Bump Level (SemVer only: major, minor, patch)"
        required: false
        default: "patch"
        type: choice
        options:
          - patch
          - minor
          - major

      version_override:
        description: "Manually override new version (e.g. 1.2.3). Leave empty to use automatic calculation."
        required: false
        type: string
  push:
    branches:
      - main
      - master
    paths-ignore:
      - '**/manifest.json'
      - '**/translations/**'
      - 'CHANGELOG.md'
      - '.github/ISSUE_TEMPLATE/**'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-release
  cancel-in-progress: true

jobs:
  versioning:
    name: Determine Version
    if: github.event_name == 'workflow_dispatch' || (github.event.head_commit != null && contains(github.event.head_commit.message, '[bump-version]'))
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    outputs:
      version: ${{ steps.get_version.outputs.version }}
      tag: ${{ steps.get_version.outputs.tag }}
      is_prerelease: ${{ steps.get_version.outputs.is_prerelease }}
      release_body: ${{ steps.get_version.outputs.release_body }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v7.0.0
        with:
          python-version: '3.15.0'

      - name: Calculate Version and Release Details
        id: get_version
        shell: bash
        env:
          RELEASE_TYPE: ${{ github.event.inputs.release_type || (contains(github.event.head_commit.message, '[bump-version]') && 'stable' || 'beta') }}
          BUMP_LEVEL: ${{ github.event.inputs.bump_level || 'patch' }}
          VERSION_OVERRIDE: ${{ inputs.version_override }}
          REPO: ${{ github.repository }}
          OWNER: ${{ github.repository_owner }}
          REPO_NAME: ${{ github.event.repository.name }}
        run: |
          python .github/scripts/calculate_release_details.py

      - name: Upload Release Body
        uses: actions/upload-artifact@v7.0.2
        with:
          name: release-body
          path: release_body.md

  sync-version:
    name: Sync Repository Version
    needs: versioning
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v7.0.0
        with:
          python-version: '3.15.0'

      - name: Configure Git and pull latest
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git reset --hard HEAD
          git pull --rebase origin ${{ github.ref_name }}

      - name: Update Files
        shell: bash
        run: |
          python .github/scripts/version_manager.py bump --type ${{ github.event.inputs.release_type || (contains(github.event.head_commit.message, '[bump-version]') && 'stable' || 'beta') }} --level ${{ github.event.inputs.bump_level || 'patch' }} --override "${{ github.event.inputs.version_override || '' }}"

      - name: Upload Updated Components
        uses: actions/upload-artifact@v7.0.2
        with:
          name: updated-components
          path: custom_components/
          retention-days: 1

      - name: Commit and Push
        run: |
          git add custom_components/*/manifest.json .github/ISSUE_TEMPLATE/*.yml .github/ISSUE_TEMPLATE/*.yaml 2>/dev/null || true
          if ! git diff --staged --quiet; then
            git commit -m "chore: release version ${{ needs.versioning.outputs.version }} [skip ci]"
            git push origin HEAD:${{ github.ref_name }} || (git pull --rebase origin ${{ github.ref_name }} && git push origin HEAD:${{ github.ref_name }})
          fi

  gh-release:
    needs: [versioning, sync-version]
    if: always() && needs.versioning.result == 'success' && needs.sync-version.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
      actions: write
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - name: Pull latest changes
        run: |
          git pull --rebase origin ${{ github.ref_name }}

      - name: Download Updated Components
        uses: actions/download-artifact@v8.0.2
        with:
          name: updated-components
          path: custom_components/

      - name: 📦 Zip Component
        run: |
          DOMAIN=$(python -c "import json, glob; print(json.load(open(glob.glob('custom_components/*/manifest.json')[0]))['domain'])")
          cd "custom_components/$DOMAIN"
          zip -r "../../$DOMAIN.zip" .
          cd ../..

      - name: Download Release Body Artifact
        uses: actions/download-artifact@v8.0.2
        with:
          name: release-body

      - name: Create GitHub Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          TAG: ${{ needs.versioning.outputs.tag }}
          VERSION: ${{ needs.versioning.outputs.version }}
          IS_PRERELEASE: ${{ needs.versioning.outputs.is_prerelease }}
        shell: bash
        run: |
          DOMAIN=$(python -c "import json, glob; print(json.load(open(glob.glob('custom_components/*/manifest.json')[0]))['domain'])")
          prerelease_arg=""
          if [ "$IS_PRERELEASE" = "true" ]; then
            prerelease_arg="--prerelease"
          fi
          
          gh release create "$TAG" \
            --target "${{ github.ref_name }}" \
            --title "Release $VERSION" \
            --notes-file "release_body.md" \
            $prerelease_arg \
            "$DOMAIN.zip"
