name: CI Orchestrator

on:
  push:
    branches: [ main, master ]
    paths-ignore:
      - 'docs/**'
      - '*.md'
      - '.github/ISSUE_TEMPLATE/**'
  pull_request:
    branches: [ main, master ]
    types: [opened, synchronize, reopened, ready_for_review]
    paths-ignore:
      - 'docs/**'
      - '*.md'
      - '.github/ISSUE_TEMPLATE/**'
  workflow_dispatch:
  workflow_call:

permissions:
  contents: write
  pull-requests: write
  security-events: write
  actions: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-ci
  cancel-in-progress: true

jobs:
  lint-test:
    name: Lint & Test
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1

      - name: Set up Python
        uses: actions/setup-python@v7.0.0
        with:
          python-version: '3.15.0'

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install ruff mypy pyyaml pytest pytest-asyncio pytest-cov aiohttp homeassistant

      - name: Validate JSON/YAML
        run: |
          python -c "import json, glob; [json.load(open(f, encoding='utf-8-sig')) for f in glob.glob('**/*.json', recursive=True)]"
          python -c "import yaml, glob; yaml.add_multi_constructor('tag:yaml.org,2002:python/name:', lambda loader, suffix, node: None, Loader=yaml.SafeLoader); yaml.add_multi_constructor('!', lambda loader, suffix, node: None, Loader=yaml.SafeLoader); [yaml.safe_load(open(f, encoding='utf-8-sig')) for f in glob.glob('**/*.yaml', recursive=True) + glob.glob('**/*.yml', recursive=True)]"

      - name: Check Integration Structure
        run: |
          DOMAIN=$(python -c "import json, glob; print(json.load(open(glob.glob('custom_components/*/manifest.json')[0]))['domain'])")
          test -d "custom_components/$DOMAIN"
          test -f "custom_components/$DOMAIN/manifest.json"
          test -f hacs.json

      - name: Format and Fix with Ruff
        run: |
          ruff check --fix .
          ruff format .

      - name: Run Mypy
        run: |
          DOMAIN=$(python -c "import json, glob; print(json.load(open(glob.glob('custom_components/*/manifest.json')[0]))['domain'])")
          mypy "custom_components/$DOMAIN"

      - name: Run Tests
        run: |
          if [ -d tests ]; then
            DOMAIN=$(python -c "import json, glob; print(json.load(open(glob.glob('custom_components/*/manifest.json')[0]))['domain'])")
            PYTHONPATH=. pytest --cov="custom_components.$DOMAIN" --cov-report=xml
          fi

  hacs-validation:
    name: Validate HACS
    runs-on: ubuntu-latest
    needs: lint-test
    steps:
      - uses: actions/checkout@v7.0.1
      - name: HACS validation
        uses: hacs/action@main
        with:
          category: integration
