name: Bug Report
description: Report a bug with the DHL Tracking integration
title: '[Bug]: '
labels: ['bug', 'triage']
assignees:
  - FaserF
body:
  - type: markdown
    attributes:
      value: |
        ## Before submitting
        - 🔍 Search existing issues to avoid duplicates
        - 🔗 View your integration in Home Assistant: [![Open your Home Assistant instance and show the dhl integration.](https://my.home-assistant.io/badges/integration.svg)](https://my.home-assistant.io/redirect/integration/?domain=dhl)

  - type: input
    id: integration_version
    attributes:
      label: Integration Version
      description: Which version of ha-dhl are you running?
      placeholder: e.g. v0.1.0
    validations:
      required: true

  - type: input
    id: ha_version
    attributes:
      label: Home Assistant Version
      placeholder: e.g. 2026.9.4
    validations:
      required: true

  - type: dropdown
    id: ha_install_type
    attributes:
      label: Home Assistant Installation Type
      options:
        - Home Assistant OS
        - Home Assistant Container
        - Home Assistant Supervised
        - Home Assistant Core
    validations:
      required: true

  - type: textarea
    id: description
    attributes:
      label: Describe the Bug
      description: A clear and concise description of the bug.
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to Reproduce
      placeholder: |
        1. Add tracking number
        2. Wait for update
        3. See error
    validations:
      required: false

  - type: textarea
    id: logs
    attributes:
      label: Relevant Logs
      description: |
        Enable debug logging in `configuration.yaml` (IMPORTANT: Do NOT share private API keys or personal postal codes):
        ```yaml
        logger:
          default: warning
          logs:
            custom_components.dhl: debug
        ```
      render: shell
    validations:
      required: true
